# Platform settings for this build (not user-facing). Make one of these per target platform.

# Command that runs a program inside a terminal; the program and its arguments are appended.
# Empty = run directly in the terminal this script was started from.
TERMINAL_CMD='/opt/muos/frontend/muxterm --'

# Base ROM directory. ROMs for this app go in "<base>/APLADX", and the Links Awakening DX
# ROM is searched for under <base> if it is not already in the Archipelago folder.
BASE_ROM_DIRECTORY='/mnt/mmc/ROMS/GBC'

# Where save files (.srm) and save states live. Both are searched recursively for files named
# after a ROM, which are wiped when that ROM is removed or a solo game is regenerated.
# Leave paths empty to prevent this cleanup.
SAVEFILE_DIRECTORY='/run/muos/storage/save/file/Gambatte'
SAVESTATE_DIRECTORY='/run/muos/storage/save/state/Gambatte'
