# Platform settings for this build (not user-facing). Make one of these per target platform.

# Command that runs a program inside a terminal; the program and its arguments are appended.
# Empty = run directly in the terminal this script was started from.
TERMINAL_CMD='/opt/muos/frontend/muxterm --'

# Characters per line on screen. The UI is five lines of at most this many characters.
LINE_WIDTH=47

# Base ROM directory. ROMs for this app go in "<base>/APLADX". The base directory is also searched
# (recursively) for the Links Awakening DX base ROM, matched by checksum, when Archipelago has none.
BASE_ROM_DIRECTORY='/mnt/mmc/ROMS/GBC'

# Optional. Where save files (.srm) and save states live. Both are searched recursively for files
# named after a ROM, which are wiped when that ROM is removed or a solo game is regenerated.
# Leave either one empty (or delete the line) to skip that cleanup.
SAVEFILE_DIRECTORY='/run/muos/storage/save/file/Gambatte'
SAVESTATE_DIRECTORY='/run/muos/storage/save/state/Gambatte'
